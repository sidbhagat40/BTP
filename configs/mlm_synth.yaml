# Continual pre-training (MLM) of ModernBERT-large on synthetic RHEA text.
# Train/val only — never touch data/splits/probe_pool.jsonl.

model_path: models/modernbert-large
train_file: data/splits/train.jsonl
val_file: data/splits/val.jsonl
output_dir: artifacts/hea-bert-synth

# Data
max_length: 512
mlm_probability: 0.15
seed: 42

# Optimization (Large on a single GPU; tune batch if OOM)
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 2.0e-5
weight_decay: 0.01
num_train_epochs: 3
warmup_ratio: 0.06
lr_scheduler_type: linear
max_grad_norm: 1.0

# Logging / checkpointing
logging_steps: 10
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
bf16: true
fp16: false
dataloader_num_workers: 0
report_to: none
